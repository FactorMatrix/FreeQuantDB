name: Python compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-wheel:
    name: CPython ${{ matrix.python }} / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            native: wheel
          - python: '3.12'
            native: wheel
          - python: '3.13'
            native: wheel
          - python: '3.14'
            native: source
          - python: '3.15'
            native: source
    env:
      FQDB_TEST_DATA_ROOT: ${{ runner.temp }}/fqdb-tests
      FQDB_TEST_EVIDENCE_ROOT: ${{ runner.temp }}/fqdb-evidence
      FQDB_WHEEL_DIR: ${{ runner.temp }}/fqdb-wheels
      PIP_CACHE_DIR: ${{ runner.temp }}/fqdb-pip-cache
    steps:
      # Official v7 tags verified when adding this workflow; pin the actual code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare build tools
        run: python -m pip install --upgrade pip setuptools wheel build
      - name: Prepare native compiler dependencies
        if: matrix.native == 'source'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libssl-dev curl perl pkg-config
      - name: Build native binding for this interpreter
        if: matrix.native == 'source'
        run: >-
          python scripts/build_libtorrent.py
          --wheel-dir "$FQDB_WHEEL_DIR"
          --cache-dir "$RUNNER_TEMP/fqdb-native-cache"
          --jobs 2
      - name: Build and install the FQDB wheel
        shell: bash
        run: |
          python -m build --outdir "$FQDB_WHEEL_DIR"
          fqdb_wheels=("$FQDB_WHEEL_DIR"/fqdb-*.whl)
          python -m pip install --find-links "$FQDB_WHEEL_DIR" "${fqdb_wheels[0]}[dev]"
          python -m pip check
      - name: Check installed SDK, CLI, service and dashboard
        run: >-
          python scripts/check_python_install.py
          --data-dir "$RUNNER_TEMP/fqdb-install-check"
          --report "$RUNNER_TEMP/fqdb-evidence/installed-wheel.json"
      - name: Compile package and tools with this interpreter
        run: python -m compileall -q src/fqdb scripts
      - name: Run synthetic native and application regression
        run: >-
          python -m pytest -q
          --basetemp="$RUNNER_TEMP/fqdb-pytest"
