<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FreeQuantDB · 数据工作台</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/overview.css" />
    <link rel="stylesheet" href="/static/catalog.css" />
    <link rel="stylesheet" href="/static/operations.css" />
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#title">跳到页面内容</a>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand-lockup" href="#/overview">
          <span class="brand-mark" aria-hidden="true">FQ</span><strong>FreeQuantDB</strong>
        </a>
        <nav aria-label="主导航">
          <div class="nav-group">
            <span class="nav-caption">数据</span>
            <a href="#/overview" data-page="overview">概览</a>
            <a href="#/datasets" data-page="datasets">数据集</a>
            <a href="#/validation" data-page="validation">质量</a>
          </div>
          <div class="nav-group">
            <span class="nav-caption">管理</span>
            <a href="#/downloads" data-page="downloads">传输<span id="nav-task-count" class="nav-count" hidden></span></a>
            <a href="#/settings" data-page="settings">设置</a>
          </div>
        </nav>
        <div class="sidebar-bottom">
          <div id="connection" class="connection-state" role="status">连接服务中</div>
          <button id="exit-gateway" class="button button-ghost" type="button">
            退出管理界面
          </button>
        </div>
      </aside>
      <main class="page-main">
        <header class="page-heading">
          <h1 id="title" tabindex="-1">概览</h1>
          <div class="heading-tools">
            <div id="heading-actions" class="action-row"></div>
            <button id="refresh" class="button" type="button">刷新本地</button>
            <button id="refresh-magnets" class="button button-primary" type="button" hidden>更新磁力链接</button>
          </div>
        </header>
        <nav
          id="section-nav"
          class="section-nav"
          aria-label="页面导航"
          hidden
        ></nav>
        <div id="error" class="callout error-callout" role="alert" hidden></div>
        <div id="catalog-refresh-result" class="callout" role="status" hidden></div>
        <section
          id="context"
          class="context-bar"
          aria-label="当前数据范围"
          hidden
        >
          <label
            >数据集<select id="dataset" aria-label="选择数据集"></select
          ></label>
          <label
            >频率<select id="frequency" aria-label="选择频率"></select
          ></label>
          <label class="scope-date"
            >开始日期<input id="start" type="date" /></label
          ><span class="range-separator">—</span>
          <label class="scope-date"
            >结束日期<input id="end" type="date" /></label
          ><button id="apply-scope" class="button" type="button">
            应用范围
          </button>
        </section>
        <div id="view" aria-live="polite"></div>
      </main>
    </div>
    <dialog id="package-detail" class="drawer" aria-label="数据包详情">
      <div class="drawer-top">
        <h2>数据包详情</h2>
        <button id="close-package" class="icon-button" aria-label="关闭详情">
          ×
        </button>
      </div>
      <div id="package-body"></div>
    </dialog>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
