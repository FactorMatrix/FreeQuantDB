[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fqdb"
version = "0.1.0"
description = "Local-first quantitative data packages, embedded BitTorrent and offline queries"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["libtorrent>=2.0.11,<3", "pyarrow>=18,<27", "pandas>=2.2,<4", "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1", "filelock>=3.16,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.9,<1", "playwright>=1.49,<2"]

[project.scripts]
fqdb = "fqdb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fqdb = ["web/static/*", "web/static/pages/*.js", "web/static/components/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
